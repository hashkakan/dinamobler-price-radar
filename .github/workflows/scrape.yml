name: Price Radar – skrapa konkurrentpriser

on:
  schedule:
    # Varje natt 03:15 UTC (05:15 svensk sommartid). Justera cron efter behov.
    - cron: "15 3 * * *"
  workflow_dispatch:        # låter dig köra den manuellt från Actions-fliken
    inputs:
      limit:
        description: "Max antal produkter (tomt = alla)"
        required: false
        default: ""
      dry_run:
        description: "Torrkörning (skriv inget)"
        type: boolean
        default: false

concurrency:
  group: price-radar
  cancel-in-progress: false

permissions:
  contents: write             # behövs av keepalive-steget nedan

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # katalogen är stor; ge den gott om tid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör skrapan
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          VS_TOKEN: ${{ secrets.VS_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python radar.py $ARGS

      # GitHub stänger av schemalagda workflows efter 60 dagars inaktivitet i repot,
      # tyst och utan varning. Workflow-körningar räknas INTE som aktivitet – bara
      # commits gör det. Utan det här steget skulle schemat dö av sig självt i höst,
      # precis som launchd-jobbet gjorde. Vi commitar därför en tidsstämpel var 45:e dag.
      - name: Håll schemat vid liv
        if: always() && github.event_name == 'schedule'
        run: |
          ALDER=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Senaste commit är $ALDER dagar gammal."
          if [ "$ALDER" -ge 45 ]; then
            git config user.name  "price-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git add .keepalive
            git commit -m "keepalive: håller det nattliga schemat aktivt"
            git push
            echo "Keepalive-commit pushad."
          else
            echo "Ingen keepalive behövs ännu."
          fi

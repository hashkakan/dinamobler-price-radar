name: Price Radar – skrapa konkurrentpriser

on:
  schedule:
    # Mån–lör 03:15 UTC: bara varor som faktiskt sålt (--min-sales 1, satt nedan).
    # 12 155 av 12 967 produkter har aldrig sålts och 77 % av alla insamlade
    # priser lag pa dem – natterna gick till varor ingen koper.
    - cron: "15 3 * * 1-6"
    # Sondag 03:15 UTC: hela sortimentet, sa varor som BORJAT salja hittas.
    # Utan den skulle en ny bastsaljare aldrig komma in i bevakningen.
    - cron: "15 3 * * 0"
  workflow_dispatch:        # låter dig köra den manuellt från Actions-fliken
    inputs:
      limit:
        description: "Max antal produkter (tomt = alla)"
        required: false
        default: ""
      dry_run:
        description: "Torrkörning (skriv inget)"
        type: boolean
        default: false
      sources:
        description: "Bara dessa domäner, kommaseparerat (tomt = alla)"
        required: false
        default: ""
      max_pages:
        description: "Max produktsidor per konkurrent (tomt = 400)"
        required: false
        default: ""
      supplier:
        description: "Riktad körning mot EN leverantör, pa_brand-namn (tomt = alla). T.ex. Rowico"
        required: false
        default: ""
      min_sales:
        description: "Bara varor som sålt minst N ggr (tomt = schemats standard, 0 = hela sortimentet)"
        required: false
        default: ""

concurrency:
  group: price-radar
  cancel-in-progress: false

permissions:
  contents: write             # behövs av keepalive-steget nedan

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # katalogen är stor; ge den gott om tid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Indexet över konkurrenternas produktsidor byggs upp natt för natt.
      # Utan det börjar varje körning om från noll och hinner bara 400 sidor
      # per källa – Trademax ensam har 31 905 relevanta URL:er.
      - name: Återställ index från förra natten
        uses: actions/cache/restore@v4
        with:
          path: state
          key: price-radar-state-${{ github.run_id }}
          restore-keys: price-radar-state-

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör skrapan
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          VS_TOKEN: ${{ secrets.VS_TOKEN }}
          # Indata går via miljövariabler, inte inklistrat i kommandoraden.
          # Dels för att flera leverantörsnamn innehåller mellanslag
          # ("Concept Living") och utan citering blir det två argument, dels
          # för att inklistrad indata annars kan bryta ut ur skalkommandot.
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
          IN_SOURCES: ${{ github.event.inputs.sources }}
          IN_MAXPAGES: ${{ github.event.inputs.max_pages }}
          IN_SUPPLIER: ${{ github.event.inputs.supplier }}
          IN_MINSALES: ${{ github.event.inputs.min_sales }}
          SCHEMA: ${{ github.event.schedule }}
        run: |
          # Manuell indata vinner. Annars styr schemat: vardagsnatten kor bara
          # salda varor, sondagsnatten hela sortimentet.
          MIN="$IN_MINSALES"
          if [ -z "$MIN" ] && [ "$SCHEMA" = "15 3 * * 1-6" ]; then
            MIN=1
          fi
          ARGS=()
          if [ -n "$MIN" ] && [ "$MIN" != "0" ]; then ARGS+=(--min-sales "$MIN"); fi
          [ -n "$IN_LIMIT" ]    && ARGS+=(--limit "$IN_LIMIT")
          [ "$IN_DRY" = "true" ] && ARGS+=(--dry-run)
          [ -n "$IN_SOURCES" ]  && ARGS+=(--sources "$IN_SOURCES")
          [ -n "$IN_MAXPAGES" ] && ARGS+=(--max-pages "$IN_MAXPAGES")
          [ -n "$IN_SUPPLIER" ] && ARGS+=(--supplier "$IN_SUPPLIER")
          python radar.py "${ARGS[@]}"

      # Sparas även om skrapningen bröts: halvfärdigt index är bättre än inget,
      # och nästa natt fortsätter där den här slutade.
      - name: Spara index till nästa natt
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: price-radar-state-${{ github.run_id }}

      # GitHub stänger av schemalagda workflows efter 60 dagars inaktivitet i repot,
      # tyst och utan varning. Workflow-körningar räknas INTE som aktivitet – bara
      # commits gör det. Utan det här steget skulle schemat dö av sig självt i höst,
      # precis som launchd-jobbet gjorde. Vi commitar därför en tidsstämpel var 45:e dag.
      - name: Håll schemat vid liv
        if: always() && github.event_name == 'schedule'
        run: |
          ALDER=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Senaste commit är $ALDER dagar gammal."
          if [ "$ALDER" -ge 45 ]; then
            git config user.name  "price-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git add .keepalive
            git commit -m "keepalive: håller det nattliga schemat aktivt"
            git push
            echo "Keepalive-commit pushad."
          else
            echo "Ingen keepalive behövs ännu."
          fi
